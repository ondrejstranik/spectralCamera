[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spectralCamera*"]

[project]
name="spectralCamera"
version="0.0.1"
dependencies = [
        'opencv-python',
        'scikit-learn',
        'lxml_html_clean',
        'tifffile',
        'imagecodecs',
        ]
requires-python='>=3.9'
authors = [
        {name = "Ondrej Stranik", email = "ondra.stranik@gmail.com"},
]
description="package to view spectral camera"
readme = "README.md"
license = "MIT"
keywords = ["instrumentation"]
classifiers = [
  "Development Status :: 3- Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
]
[project.optional-dependencies]
docs = [
        'mkdocs',
        'mkdocs-material',
        'mkdocstrings[python]',
        ]
all = [
        'viscope @ git+https://github.com/ondrejstranik/viscope.git',
        ]

[project.urls]
Repository = "https://github.com/ondrejstranik/spectralCamera"
